name: historical-import-rehearsal
on:
  workflow_dispatch:
    inputs:
      last_row:
        description: 'Verified last row of the complete staging source grid (required for new capture)'
        required: true
        type: string
      decimal_separator:
        description: 'Explicit formatted-value decimal separator (no grouping)'
        type: choice
        options: ['.', ',']
        default: '.'
      date_format:
        description: 'Explicit source date display convention; never guess/reformat the sheet'
        type: choice
        options: ['yyyy-MM-dd', 'dd/MM/yyyy', 'd/M/yyyy', 'MM/dd/yyyy']
        default: 'yyyy-MM-dd'
      retry_run_id:
        description: 'Prior rehearsal run ID: reuse its encrypted frozen snapshot, never recapture on retry'
        type: string
        default: ''
      approval_file:
        description: 'Optional reviewed repo-relative JSON manifest scoped to the snapshot hash'
        type: string
        default: ''
permissions:
  contents: read
  id-token: write
  actions: read
concurrency:
  group: ci-cd-staging
  cancel-in-progress: false
jobs:
  rehearse:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 120
    env:
      ARCHIVE_PASSWORD: ${{ secrets.IMPORT_ARCHIVE_PASSWORD }}
      RETRY_RUN_ID: ${{ inputs.retry_run_id }}
      APPROVAL_FILE: ${{ inputs.approval_file }}
      LAST_ROW: ${{ inputs.last_row }}
      DECIMAL_SEPARATOR: ${{ inputs.decimal_separator }}
      GUITO_SOURCE_DATE_FORMAT: ${{ inputs.date_format }}
      GUITO_IMPORT_CONFIRM: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate protected evidence prerequisites
        run: |
          test -n "$ARCHIVE_PASSWORD"
          mkdir -p "$RUNNER_TEMP/import-evidence"
          if [ -n "$APPROVAL_FILE" ]; then
            case "$APPROVAL_FILE" in /*|*..*) exit 1 ;; esac
            test -f "$APPROVAL_FILE"
            cp "$APPROVAL_FILE" "$RUNNER_TEMP/import-evidence/approval.json"
          fi
      - name: Hermetic importer verification
        run: dotnet test tst/guito-api.Tests --filter FullyQualifiedName~HistoricalExpenseImportTests --verbosity quiet
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::497087877832:role/guito-api-deploy
          aws-region: eu-west-1
      - name: Verify pipeline-owned schema prerequisite (read only)
        run: |
          export GUITO_STAGING_DB_SECRET_ARN="$(aws secretsmanager describe-secret --secret-id guito-api/db-staging --query ARN --output text)"
          printf 'GUITO_STAGING_DB_SECRET_ARN=%s\n' "$GUITO_STAGING_DB_SECRET_ARN" >> "$GITHUB_ENV"
          for attempt in {1..12}; do
            if aws rds-data execute-statement --resource-arn arn:aws:rds:eu-west-1:497087877832:cluster:db-cluster --secret-arn "$GUITO_STAGING_DB_SECRET_ARN" --database guito_staging --sql "SELECT 1 FROM expense_import_rows LIMIT 0" >"$RUNNER_TEMP/import-schema-check.json" 2>"$RUNNER_TEMP/import-schema-error.txt"; then
              verified=true
              break
            fi
            if ! python3 -c 'import os,pathlib,sys; sys.exit(0 if "DatabaseResumingException" in (pathlib.Path(os.environ["RUNNER_TEMP"])/"import-schema-error.txt").read_text() else 1)'; then exit 1; fi
            sleep 5
          done
          test "${verified:-false}" = true
      - name: Download prior protected snapshot
        if: inputs.retry_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: historical-import-evidence
          run-id: ${{ inputs.retry_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/import-download
      - name: Recover frozen snapshot for retry
        if: inputs.retry_run_id != ''
        run: |
          python3 -c 'import os,hmac,hashlib,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"import-download"; expected=(p/"evidence.mac").read_text().strip(); actual=hmac.new(os.environ["ARCHIVE_PASSWORD"].encode(),(p/"evidence.tar.enc").read_bytes(),hashlib.sha256).hexdigest(); assert hmac.compare_digest(expected,actual), "Protected archive authentication failed"'
          openssl enc -d -aes-256-cbc -pbkdf2 -in "$RUNNER_TEMP/import-download/evidence.tar.enc" -pass env:ARCHIVE_PASSWORD | tar -xz -C "$RUNNER_TEMP/import-evidence" --wildcards '*.snapshot.json'
      - name: Capture staging Sheets with read-only OAuth scope
        if: inputs.retry_run_id == ''
        run: |
          export GOOGLE_KEY_FILE="$RUNNER_TEMP/import-google-key.json"
          aws ssm get-parameter --name /guito-api/staging --with-decryption --query Parameter.Value --output text | python3 -c 'import json,sys,os; p=json.load(sys.stdin); open(os.environ["GOOGLE_KEY_FILE"],"w").write(json.dumps(p["GoogleServiceAccount"]))'
          chmod 600 "$GOOGLE_KEY_FILE"
          dotnet run --project tools/Guito.HistoricalImport -- capture "$GITHUB_WORKSPACE" "$LAST_ROW" "$RUNNER_TEMP/import-evidence" "$DECIMAL_SEPARATOR"
          rm -f "$GOOGLE_KEY_FILE"
      - name: Import and compare persisted records (staging only)
        run: |
          snapshots=("$RUNNER_TEMP/import-evidence/"*.snapshot.json)
          test "${#snapshots[@]}" -eq 1
          approvals=()
          if [ -n "$APPROVAL_FILE" ]; then approvals=("$RUNNER_TEMP/import-evidence/approval.json"); fi
          dotnet run --project tools/Guito.HistoricalImport -- import "$GITHUB_WORKSPACE" "${snapshots[0]}" "$RUNNER_TEMP/import-evidence/report.json" "${approvals[@]}"
          dotnet run --project tools/Guito.HistoricalImport -- import "$GITHUB_WORKSPACE" "${snapshots[0]}" "$RUNNER_TEMP/import-evidence/retry-verification.json" "${approvals[@]}"
      - name: Encrypt evidence even when parity blocks readiness
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/import-google-key.json"
          test -n "$ARCHIVE_PASSWORD"
          mkdir -p "$RUNNER_TEMP/import-protected"
          tar -cz -C "$RUNNER_TEMP/import-evidence" . | openssl enc -aes-256-cbc -salt -pbkdf2 -out "$RUNNER_TEMP/import-protected/evidence.tar.enc" -pass env:ARCHIVE_PASSWORD
          python3 -c 'import os,hmac,hashlib,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"import-protected"; (p/"evidence.mac").write_text(hmac.new(os.environ["ARCHIVE_PASSWORD"].encode(),(p/"evidence.tar.enc").read_bytes(),hashlib.sha256).hexdigest())'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-import-evidence
          path: ${{ runner.temp }}/import-protected/
          retention-days: 30
          if-no-files-found: error
