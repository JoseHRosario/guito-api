# T5 (issue #6): CI/CD for the Guito API.
#   • test           — hermetic unit suite on every push and PR (required check).
#   • deploy-staging — push to a feature/* branch (or manual dispatch) deploys
#     staging and smokes it with the sit auth-contract + business suites.
#   • deploy-production — push to master (or manual dispatch) deploys production
#                      and smokes it the same way.
# AWS authentication is OIDC only (role guito-api-deploy, trust pinned to
# repo:JoseHRosario/guito-api) — no long-lived AWS keys anywhere.
name: ci-cd

on:
  push:
    branches: ['**']   # branch pushes only — a tag push must not deploy anything.
                       # No pull_request trigger: the push run already tests the
                       # exact head SHA (and reports the check on the PR), so a
                       # pull_request run would only duplicate it.
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy (manual runs only)'
        type: choice
        options: [staging, production]
        default: staging
      rehearse_history:
        description: 'Opt-in staging historical import after deployment (never on push)'
        type: boolean
        default: false
      last_row:
        description: 'Operator-verified final source grid row; required for rehearsal'
        type: string
        default: ''
      decimal_separator:
        description: 'Operator-verified source decimal separator (. or ,)'
        type: string
        default: ''
      date_format:
        description: 'Operator-verified source date format'
        type: string
        default: ''
      retry_run_id:
        description: 'Prior run ID whose protected frozen archive must be reused'
        type: string
        default: ''
      approval_file:
        description: 'Reviewed repo-relative snapshot-scoped approval manifest'
        type: string
        default: ''

permissions:
  id-token: write   # OIDC federation with AWS (guito-api-deploy role)
  contents: read

concurrency:
  # Every staging deployment shares one lane to avoid overlapping writes.
  group: ci-cd-${{ ((github.event_name == 'workflow_dispatch' && inputs.environment == 'production') || (github.event_name == 'push' && github.ref_name == 'master')) && 'production' || 'staging' }}
  cancel-in-progress: false

jobs:
  test:
    name: dotnet test (hermetic unit suite)
    runs-on: ubuntu-latest
    permissions:
      contents: read   # never touches AWS — no id-token here
    steps:
      - name: Validate manual rehearsal request
        if: github.event_name == 'workflow_dispatch' && inputs.rehearse_history
        env:
          TARGET: ${{ inputs.environment }}
          LAST_ROW: ${{ inputs.last_row }}
          DECIMAL_SEPARATOR: ${{ inputs.decimal_separator }}
          DATE_FORMAT: ${{ inputs.date_format }}
        run: |
          test "$TARGET" = staging
          [[ "$LAST_ROW" =~ ^[1-9][0-9]*$ ]]
          case "$DECIMAL_SEPARATOR" in '.'|',') ;; *) exit 1 ;; esac
          case "$DATE_FORMAT" in yyyy-MM-dd|dd/MM/yyyy|d/M/yyyy|MM/dd/yyyy|M/d/yyyy) ;; *) exit 1 ;; esac
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run hermetic IAM reconciliation tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p 'test_reconcile_iam.py' -v
      - name: Run hermetic import workflow safety tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p 'test_import_workflow.py' -v
      - name: Run unit tests (no Integration category — those run post-deploy)
        run: dotnet test --filter "Category!=Integration"

  deploy-staging:
    name: deploy + smoke (staging)
    needs: test
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging') ||
      (github.event_name == 'push' && startsWith(github.ref_name, 'feature/'))
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Assume AWS deploy role (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::497087877832:role/guito-api-deploy
          aws-region: eu-west-1
      - name: Deploy API + authorizer (staging)
        run: ENV=staging EXPENSE_STORE=Postgres ./deploy/deploy.sh
      - name: Smoke — auth contract (Google token + agent key) and business round-trip
        run: ./scripts/run-deployed-tests.sh staging

  historical-import:
    name: opt-in frozen history rehearsal (staging only)
    needs: deploy-staging
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'staging' && inputs.rehearse_history
    permissions:
      contents: read
      id-token: write
      actions: read
    uses: ./.github/workflows/historical-import-rehearsal.yml
    with:
      last_row: ${{ inputs.last_row }}
      decimal_separator: ${{ inputs.decimal_separator }}
      date_format: ${{ inputs.date_format }}
      retry_run_id: ${{ inputs.retry_run_id }}
      approval_file: ${{ inputs.approval_file }}

  deploy-production:
    name: deploy + smoke (production)
    needs: test
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'production') ||
      (github.event_name == 'push' && github.ref_name == 'master')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Assume AWS deploy role (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::497087877832:role/guito-api-deploy
          aws-region: eu-west-1
      - name: Deploy API + authorizer (production)
        run: ENV=production ./deploy/deploy.sh
      - name: Smoke — auth contract (Google token + agent key) and business round-trip
        run: ./scripts/run-deployed-tests.sh production
