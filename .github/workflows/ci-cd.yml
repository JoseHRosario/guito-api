# T5 (issue #6): CI/CD for the Guito API.
#   • test           — hermetic unit suite on every push and PR (required check).
#   • deploy-staging — push to a feature/* branch (or manual dispatch) deploys
#     staging and smokes it with the sit auth-contract + business suites.
#   • deploy-production — push to master (or manual dispatch) deploys production
#                      and verifies it read-only (never test writes).
# AWS authentication is OIDC only (role guito-api-deploy, trust pinned to
# repo:JoseHRosario/guito-api) — no long-lived AWS keys anywhere.
name: ci-cd

on:
  push:
    branches: ['**']   # branch pushes only — a tag push must not deploy anything.
                       # No pull_request trigger: the push run already tests the
                       # exact head SHA (and reports the check on the PR), so a
                       # pull_request run would only duplicate it.
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy (manual runs only)'
        type: choice
        options: [staging, production]
        default: staging
      infrastructure_target:
        description: 'Infrastructure adoption only (none runs normal app deployment)'
        type: choice
        options: [none, sessions-staging, sessions-production, postgres-shared]
        default: none
      infrastructure_action:
        description: 'Plan an import or execute the exact reviewed change set'
        type: choice
        options: [plan-import, execute-import]
        default: plan-import
      infrastructure_change_set_arn:
        description: 'Full reviewed CloudFormation change-set ARN (required for execute-import)'
        type: string
        required: false

permissions:
  id-token: write   # OIDC federation with AWS (guito-api-deploy role)
  contents: read

concurrency:
  # Both environments share IAM and Aurora: adoption and app deploys cannot race.
  group: ci-cd-guito-storage
  cancel-in-progress: false

jobs:
  infrastructure-adoption:
    name: CloudFormation storage adoption (infrastructure only)
    needs: test
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.infrastructure_target != 'none'
    runs-on: ubuntu-latest
    environment: ${{ (inputs.infrastructure_target == 'postgres-shared' || inputs.infrastructure_target == 'sessions-production') && 'production' || 'staging' }}
    env:
      ACTION: ${{ inputs.infrastructure_action }}
      TARGET: ${{ inputs.infrastructure_target }}
      CSARN: ${{ inputs.infrastructure_change_set_arn }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Validate infrastructure inputs (no AWS)
        shell: bash
        run: |
          set -euo pipefail
          case "$TARGET" in
            sessions-staging|sessions-production|postgres-shared) ;;
            *) echo 'Invalid infrastructure target' >&2; exit 1 ;;
          esac
          case "$ACTION" in
            plan-import|execute-import) ;;
            *) echo 'Invalid infrastructure action' >&2; exit 1 ;;
          esac
          if [ "$ACTION" = execute-import ] && [ -z "$CSARN" ]; then
            echo 'execute-import requires the full reviewed change-set ARN' >&2
            exit 1
          fi
          if [ -n "$CSARN" ] && ! [[ "$CSARN" =~ ^arn:aws:cloudformation:eu-west-1:497087877832:changeSet/guito-infra-[A-Za-z0-9-]+/[A-Za-z0-9-]+$ ]]; then
            echo 'Invalid infrastructure change-set ARN' >&2
            exit 1
          fi
      - name: Assume AWS deploy role (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::497087877832:role/guito-api-deploy
          aws-region: eu-west-1
      - name: Run storage adoption controller
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/guito-infrastructure"
          args=("$ACTION" --target "$TARGET" --output-dir "$RUNNER_TEMP/guito-infrastructure")
          if [ -n "$CSARN" ]; then
            args+=(--change-set-arn "$CSARN")
          fi
          python3 deploy/storage-infrastructure.py "${args[@]}"
      - name: Check nonsecret plan artifact
        id: plan-artifact
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/guito-infrastructure/infrastructure-plan.json" ]; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Upload nonsecret infrastructure plan
        if: ${{ success() && steps.plan-artifact.outputs.exists == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: guito-infrastructure-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/guito-infrastructure/infrastructure-plan.json
          if-no-files-found: error

  test:
    name: dotnet test (hermetic unit suite)
    runs-on: ubuntu-latest
    permissions:
      contents: read   # never touches AWS — no id-token here
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check and test Apps Script expense loader (hermetic)
        run: |
          node --check scripts/sheets-refresh/Code.js
          node --test scripts/sheets-refresh/refresh.test.js
      - name: Run hermetic deployment and IAM tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Run unit tests (no Integration category — those run post-deploy)
        run: dotnet test --filter "Category!=Integration"

  deploy-staging:
    name: deploy + smoke (staging)
    needs: test
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.infrastructure_target == 'none' && inputs.environment == 'staging') ||
      (github.event_name == 'push' && startsWith(github.ref_name, 'feature/'))
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Assume AWS deploy role (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::497087877832:role/guito-api-deploy
          aws-region: eu-west-1
      - name: Deploy API + authorizer (staging)
        env:
          SHEETS_REPORTING_AUTHENTICATION: ${{ vars.SHEETS_REPORTING_AUTHENTICATION || 'preserve' }}
          SHEETS_REPORTING_GOOGLE_AUDIENCE: ${{ vars.SHEETS_REPORTING_AUTHENTICATION == 'enabled' && vars.SHEETS_REPORTING_GOOGLE_AUDIENCE || '' }}
          SHEETS_REPORTING_GOOGLE_SUBJECT: ${{ vars.SHEETS_REPORTING_AUTHENTICATION == 'enabled' && vars.SHEETS_REPORTING_GOOGLE_SUBJECT || '' }}
          SHEETS_REPORTING_IDENTITY_VERIFIED: ${{ vars.SHEETS_REPORTING_IDENTITY_VERIFIED || 'false' }}
        run: ENV=staging ./deploy/deploy.sh
      - name: Read-only auth and business verification (no synthetic records)
        run: ./scripts/run-deployed-tests.sh staging read-only
      # Replacement write acceptance is deferred; no synthetic financial records.

  deploy-production:
    name: deploy + smoke (production)
    needs: test
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.infrastructure_target == 'none' && inputs.environment == 'production') ||
      (github.event_name == 'push' && github.ref_name == 'master')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Assume AWS deploy role (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::497087877832:role/guito-api-deploy
          aws-region: eu-west-1
      - name: Deploy API + authorizer (production)
        env:
          SHEETS_REPORTING_AUTHENTICATION: ${{ vars.SHEETS_REPORTING_AUTHENTICATION || 'preserve' }}
          SHEETS_REPORTING_GOOGLE_AUDIENCE: ${{ vars.SHEETS_REPORTING_AUTHENTICATION == 'enabled' && vars.SHEETS_REPORTING_GOOGLE_AUDIENCE || '' }}
          SHEETS_REPORTING_GOOGLE_SUBJECT: ${{ vars.SHEETS_REPORTING_AUTHENTICATION == 'enabled' && vars.SHEETS_REPORTING_GOOGLE_SUBJECT || '' }}
          SHEETS_REPORTING_IDENTITY_VERIFIED: ${{ vars.SHEETS_REPORTING_IDENTITY_VERIFIED || 'false' }}
          ALLOW_PRODUCTION_SHEETS_REPORTING: ${{ vars.ALLOW_PRODUCTION_SHEETS_REPORTING || 'false' }}
        run: ENV=production ./deploy/deploy.sh
      - name: Read-only production auth and business verification
        run: ./scripts/run-deployed-tests.sh production read-only
